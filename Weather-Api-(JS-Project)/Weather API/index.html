<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Weather App</title>

    <!-- CSS link -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Remix icon cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>


    <div class="container">

        <!-- Search Bar -->
        <div class="search">
            <h1></h1>
            <input type="text" placeholder="Enter City Name" id="wcity" spellcheck="false">
            <button id="btn">
                <i class="ri-search-line"></i>
            </button>
        </div>

        <!-- main Section -->
        <div class="weather">
            <img src="image/weather.png" alt="" class="weather-icon">
            <h1 class="temp">29°c</h1>
            <h2 class="city">Surat</h2>
            <div class="details">
                <div class="col">
                    <i class="ri-water-percent-line"></i>
                    <div>
                        <p class="humidity">82%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <i class="ri-windy-line"></i>
                    <div>
                        <p class="wind">18 Km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JS link -->
    <script src="script.js"></script>

</body>

</html>
